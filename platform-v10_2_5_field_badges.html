<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة العمل الموحد للأبحاث والدراسات الميدانية — V10</title>

<!-- مكتبات -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- خطوط -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
 * platform-v10.css
 * ============================================================ */

:root{
  --navy:#152944;
  --navy-2:#1E3A5F;
  --teal:#3E7C74;
  --teal-light:#EAF2F0;
  --amber:#C99A3D;
  --amber-dark:#A87F2E;
  --amber-soft:#FBF2E1;
  --bg:#EEF1F0;
  --card:#FFFFFF;
  --ink:#1B222A;
  --ink-soft:#4B5C74;
  --muted:#647079;
  --border:#DCE3E1;
  --danger:#B3492F;
  --danger-bg:#FBEDE8;
  --success:#3E7C55;
  --success-bg:#EAF3EC;
  --info:#0288D1;
  --info-bg:#E1F5FE;
  --radius:12px;
  --shadow:0 1px 2px rgba(18,37,64,.06), 0 8px 24px -12px rgba(18,37,64,.18);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Tajawal',Tahoma,sans-serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  min-height:100vh;
}
.nums{
  font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;
  font-variant-numeric:tabular-nums;
}

/* ============ Sidebar ============ */
#sidebar{
  width:260px;
  flex-shrink:0;
  background:var(--navy);
  color:#EAF0F5;
  display:flex;
  flex-direction:column;
  padding:20px 0;
  overflow-y:auto;
}
.brand{
  padding:0 20px 18px 20px;
  border-bottom:1px solid rgba(255,255,255,.12);
  margin-bottom:10px;
  flex-shrink:0;
}
.brand-title{font-size:15px;font-weight:800;color:#fff;}
.brand-sub{font-size:11.5px;color:#9FB2C4;margin-top:4px;}
nav{display:flex;flex-direction:column;gap:2px;padding:8px 10px;flex:1;}
.nav-btn{
  display:flex;
  align-items:center;
  gap:10px;
  background:none;
  border:none;
  color:#C9D6E2;
  padding:10px 12px;
  border-radius:8px;
  font-family:inherit;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  text-align:right;
  width:100%;
  transition:all .15s;
  position:relative;
}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-btn.active{background:var(--amber);color:#1B222A;font-weight:700;}
.nav-btn .badge-count{
  background:var(--danger);
  color:#fff;
  font-size:10.5px;
  font-weight:800;
  padding:2px 7px;
  border-radius:99px;
  margin-right:auto;
  min-width:22px;
  text-align:center;
}
.nav-btn.active .badge-count{background:var(--navy);color:#fff;}
.nav-section{
  color:#7B92AA;
  font-size:10.5px;
  font-weight:700;
  padding:14px 12px 6px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.nav-section.domain{
  color:#E8EEF4;
  font-size:11.5px;
  font-weight:800;
  margin-top:6px;
  padding:11px 12px 7px;
  text-transform:none;
  letter-spacing:0;
  border-top:1px solid rgba(255,255,255,.08);
}
.nav-section.domain.workers-domain{color:#BFDCD7;}
.nav-section.domain.projects-domain{color:#E9C97D;}
.nav-section.support-domain{
  margin-top:8px;
  border-top:1px solid rgba(255,255,255,.08);
}
.sidebar-foot{
  padding:12px 20px 0 20px;
  border-top:1px solid rgba(255,255,255,.1);
  margin-top:8px;
  flex-shrink:0;
}
.sidebar-foot .who{
  font-size:12px;
  color:#9FB2C4;
  margin-bottom:8px;
  line-height:1.5;
}
.sidebar-foot .who strong{color:#fff;font-size:13px;}
.sidebar-foot button{
  background:none;
  border:1px solid rgba(255,255,255,.25);
  color:#C9D6E2;
  font-family:inherit;
  font-size:12px;
  padding:7px 10px;
  border-radius:7px;
  cursor:pointer;
  width:100%;
}
.sidebar-foot button:hover{border-color:#fff;color:#fff;}

/* ============ Main ============ */
#main{flex:1;display:flex;flex-direction:column;min-width:0;}
header{
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:14px 26px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}
header h1{font-size:17px;margin:0;font-weight:800;}
.breadcrumb{
  font-size:12.5px;
  color:var(--muted);
  margin-top:4px;
}
.breadcrumb .sep{margin:0 6px;color:#B8C2C0;}
.breadcrumb a{
  color:var(--teal);
  cursor:pointer;
  text-decoration:none;
  font-weight:600;
}
.breadcrumb a:hover{text-decoration:underline;}
#content{
  padding:24px 26px 60px 26px;
  overflow-y:auto;
  flex:1;
}
p.section-hint{
  color:var(--muted);
  font-size:13.5px;
  margin:0 0 20px 0;
  line-height:1.7;
}

/* ============ Cards ============ */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:18px;
}
.card h3{margin:0 0 14px 0;font-size:15px;font-weight:700;}
.grid{display:grid;gap:12px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
.grid.cols-4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media(max-width:900px){
  .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}
}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500;}
.field select,.field input,.field textarea{width:100%;}
.field textarea{
  font-family:inherit;
  resize:vertical;
  min-height:80px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  font-size:13.5px;
}
.field input,.field select{
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  font-family:inherit;
  font-size:13.5px;
  background:#fff;
}

/* ============ Buttons ============ */
.btn{
  font-family:inherit;
  font-size:13.5px;
  font-weight:700;
  border:none;
  border-radius:8px;
  padding:9px 16px;
  cursor:pointer;
  transition:all .15s;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-2);}
.btn-amber{background:var(--amber);color:#1B222A;}
.btn-amber:hover{background:var(--amber-dark);color:#fff;}
.btn-outline{background:none;border:1px solid var(--border);color:var(--ink);}
.btn-outline:hover{border-color:var(--navy);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{opacity:.9;}
.btn-danger-outline{background:none;border:1px solid var(--danger);color:var(--danger);}
.btn-success{background:var(--success);color:#fff;}
.btn-success:hover{opacity:.9;}
.btn-info{background:var(--info);color:#fff;}
.btn-info:hover{opacity:.9;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn-icon{padding:7px 10px;}

/* ============ Tables ============ */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:right;
  color:var(--muted);
  font-weight:600;
  font-size:12px;
  padding:8px 10px;
  border-bottom:2px solid var(--border);
  white-space:nowrap;
  background:#F8FAFA;
  position:sticky;
  top:0;
  z-index:5;
}
td{
  padding:10px;
  border-bottom:1px solid var(--border);
  vertical-align:middle;
}
.table-wrap{overflow-x:auto;}
.sticky-table-wrap{
  max-height:70vh;
  overflow-y:auto;
  border-radius:10px;
  border:1px solid var(--border);
}

/* ============ Badges ============ */
.badge{
  display:inline-block;
  padding:3px 9px;
  border-radius:100px;
  font-size:11.5px;
  font-weight:700;
}
.badge-teal{background:var(--teal-light);color:var(--teal);}
.badge-amber{background:var(--amber-soft);color:var(--amber-dark);}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-danger{background:var(--danger-bg);color:var(--danger);}
.badge-muted{background:#EEF0F1;color:var(--muted);}
.badge-navy{background:#E1E8F0;color:var(--navy);}
.badge-info{background:var(--info-bg);color:var(--info);}

/* ============ Empty States ============ */
.empty-state{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
  font-size:13.5px;
  border:1.5px dashed var(--border);
  border-radius:var(--radius);
}
.empty-rich{
  text-align:center;
  padding:50px 20px;
  background:#fff;
  border:2px dashed var(--border);
  border-radius:14px;
}
.empty-rich .icon{
  font-size:56px;
  margin-bottom:16px;
  opacity:.4;
}
.empty-rich h3{
  margin:0 0 8px;
  font-size:17px;
  color:var(--ink);
  font-family:'Cairo',sans-serif;
}
.empty-rich p{
  margin:0 0 20px;
  font-size:13.5px;
  color:var(--muted);
}

/* ============ Links ============ */
.link-btn{
  background:none;
  border:none;
  color:var(--teal);
  font-family:inherit;
  font-size:12.5px;
  cursor:pointer;
  padding:0;
  font-weight:600;
}
.link-btn:hover{text-decoration:underline;}
.link-btn.danger{color:var(--danger);}
.link-btn.warning{color:var(--amber-dark);}

/* ============ Toast ============ */
.toast{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  background:var(--navy);
  color:#fff;
  padding:12px 22px;
  border-radius:10px;
  font-size:13.5px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  z-index:9999;
  opacity:0;
  pointer-events:none;
  transition:all .3s;
  display:flex;
  align-items:center;
  gap:10px;
  max-width:90vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.danger{background:var(--danger);}
.toast.success{background:var(--success);}
.toast.warn{background:var(--amber-dark);}
.toast.info{background:var(--info);}

/* ============ Login ============ */
.center-screen{
  margin:auto;
  max-width:440px;
  width:100%;
  padding:20px;
}
.center-screen .card{padding:32px;}
.center-screen h2{
  margin:0 0 6px 0;
  font-size:22px;
  font-family:'Cairo',sans-serif;
}
.center-screen p{
  color:var(--muted);
  font-size:13px;
  margin:0 0 20px 0;
}
.login-field{margin-bottom:12px;}
.login-field label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
  font-weight:600;
}
.login-field input{
  width:100%;
  padding:12px 14px;
  border:1.5px solid var(--border);
  border-radius:10px;
  font-family:inherit;
  font-size:14px;
  transition:border .15s;
}
.login-field input:focus{
  outline:none;
  border-color:var(--teal);
  box-shadow:0 0 0 4px rgba(62,124,116,.08);
}
.login-btn{
  width:100%;
  padding:13px;
  font-size:14.5px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#C99A3D,#D4A64A);
  color:#1B222A;
  font-family:inherit;
  font-weight:800;
  cursor:pointer;
  transition:all .15s;
}
.login-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 18px rgba(201,154,61,.25);
}
.login-btn:disabled{opacity:.6;cursor:wait;transform:none;}

/* ============ Modal ============ */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(21,41,68,.55);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  z-index:1000;
  padding:30px 20px;
  overflow-y:auto;
  backdrop-filter:blur(2px);
}
.modal-box{
  background:#fff;
  border-radius:14px;
  padding:26px;
  max-width:640px;
  width:100%;
  max-height:92vh;
  overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.modal-box.modal-xl{max-width:960px;}
.modal-box.modal-2xl{max-width:1100px;}
.modal-box h3{margin:0 0 6px 0;font-size:18px;}
.modal-box .sub{color:var(--muted);font-size:13px;margin:0 0 20px 0;}

/* ============ KPI ============ */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.kpi-grid{grid-template-columns:1fr;}}
.kpi-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  position:relative;
  overflow:hidden;
  transition:all .15s;
}
.kpi-card:hover{border-color:var(--teal);}
.kpi-card .num{
  font-size:28px;
  font-weight:800;
  line-height:1;
  color:var(--navy);
}
.kpi-card .lbl{
  font-size:12.5px;
  color:var(--muted);
  margin-top:6px;
}
.kpi-card.teal .num{color:var(--teal);}
.kpi-card.amber .num{color:var(--amber-dark);}
.kpi-card.success .num{color:var(--success);}
.kpi-card.danger .num{color:var(--danger);}
.kpi-card.info .num{color:var(--info);}

/* ============ Filter Bar ============ */
.filter-bar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px;
  align-items:center;
}
.filter-pill{
  padding:8px 16px;
  border-radius:100px;
  border:1.5px solid var(--border);
  background:#fff;
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all .15s;
  color:var(--muted);
}
.filter-pill:hover{border-color:var(--navy);color:var(--navy);}
.filter-pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.filter-pill .count{opacity:.75;font-size:11.5px;}
.filter-select{
  padding:8px 14px;
  border-radius:8px;
  border:1.5px solid var(--border);
  background:#fff;
  font-family:'Tajawal',sans-serif;
  font-size:13px;
  cursor:pointer;
  min-width:180px;
  color:var(--ink);
}
.filter-select:focus{
  outline:none;
  border-color:var(--teal);
}

/* ============ Chips ============ */
.chips-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  border-radius:99px;
  background:#fff;
  border:1px solid var(--border);
  font-size:12px;
  font-weight:600;
  color:var(--muted);
}
.chip strong{
  color:var(--ink);
  font-family:'Cairo',sans-serif;
  font-weight:800;
}
.chip.teal{background:var(--teal-light);border-color:transparent;color:var(--teal);}
.chip.teal strong{color:var(--teal);}
.chip.amber{background:var(--amber-soft);border-color:transparent;color:var(--amber-dark);}
.chip.amber strong{color:var(--amber-dark);}
.chip.success{background:var(--success-bg);border-color:transparent;color:var(--success);}
.chip.success strong{color:var(--success);}
.chip.danger{background:var(--danger-bg);border-color:transparent;color:var(--danger);}
.chip.danger strong{color:var(--danger);}

/* ============ Spinner ============ */
.spinner{
  display:inline-block;
  width:14px;
  height:14px;
  border:2px solid rgba(21,41,68,.15);
  border-top-color:var(--navy);
  border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============ Progress Bar ============ */
.progress-track{
  height:8px;
  overflow:hidden;
  background:#E6E9EF;
  border-radius:99px;
}
.progress-track span{
  display:block;
  height:100%;
  border-radius:inherit;
  background:var(--teal);
  transition:width .4s ease;
}

/* ============ Tabs ============ */
.subtabs{
  display:flex;
  gap:6px;
  border-bottom:2px solid var(--border);
  margin-bottom:20px;
  flex-wrap:wrap;
}
.subtab{
  background:none;
  border:none;
  color:var(--muted);
  font-family:inherit;
  font-size:13.5px;
  font-weight:600;
  padding:10px 16px;
  cursor:pointer;
  border-bottom:3px solid transparent;
  transition:all .15s;
}
.subtab.active{
  color:var(--navy);
  border-bottom-color:var(--amber);
  font-weight:800;
}

/* ============ Project Box ============ */
.project-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px;
  margin-bottom:20px;
  transition:all .2s;
}
.project-box.clickable{cursor:pointer;}
.project-box.clickable:hover{
  border-color:var(--teal);
  box-shadow:0 8px 24px rgba(21,41,68,.08);
}
.project-box-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.project-box-head h3{
  margin:0 0 6px 0;
  font-size:17px;
  font-weight:800;
}
.project-sections{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
@media(max-width:900px){.project-sections{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.project-sections{grid-template-columns:1fr;}}
.section-box{
  padding:18px 14px;
  border:1.5px solid var(--border);
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  transition:all .2s;
  background:#FAFBFC;
}
.section-box:hover{
  border-color:var(--teal);
  background:var(--teal-light);
  transform:translateY(-2px);
}
.section-box .icon{font-size:32px;margin-bottom:8px;line-height:1;}
.section-box .title{font-weight:700;font-size:13.5px;margin-bottom:6px;}
.section-box .stat{font-size:22px;font-weight:800;color:var(--navy);line-height:1;}
.section-box .lbl{font-size:11px;color:var(--muted);margin-top:4px;}

/* ============ Assignments ============ */
.assign-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:14px;
}
.assign-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  transition:all .15s;
  position:relative;
}
.assign-card:hover{
  border-color:var(--teal);
  box-shadow:0 4px 12px rgba(21,41,68,.06);
}
.assign-card.active{border-right:4px solid var(--success);}
.assign-card.ended{border-right:4px solid var(--muted);opacity:.75;}
.assign-card .head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:10px;
}
.assign-card .person{display:flex;flex-direction:column;gap:4px;}
.assign-card .person .name{
  font-family:'Cairo',sans-serif;
  font-weight:800;
  font-size:15px;
  color:var(--ink);
}
.assign-card .person .nid{
  font-size:11.5px;
  color:var(--muted);
  font-family:'IBM Plex Sans Arabic',sans-serif;
}
.assign-card .info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--border);
}
.assign-card .info-item .lbl{font-size:10.5px;color:var(--muted);margin-bottom:2px;}
.assign-card .info-item .val{font-size:12.5px;font-weight:700;color:var(--ink);}
.assign-card .actions{
  display:flex;
  gap:6px;
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid var(--border);
  flex-wrap:wrap;
}

/* ============ Work Units ============ */
.unit-row{
  display:grid;
  grid-template-columns:120px 1fr 140px 120px auto;
  gap:12px;
  align-items:center;
  padding:10px 14px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:6px;
  transition:all .12s;
}

  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = 'toast'; }, kind === 'danger' ? 5000 : 2800);
}

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, x => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[x]));
}

function fmtNum(n){
  return (Math.round((n||0)*100)/100).toLocaleString('ar-EG');
}

function fmtDate(d){
  if(!d) return '—';
  try {
    return new Date(d).toLocaleDateString('ar-EG', {
      year:'numeric', month:'2-digit', day:'2-digit'
    });
  } catch { return d; }
}

function fmtDateTime(d){
  if(!d) return '—';
  try {
    const dt = new Date(d);
    return dt.toLocaleDateString('ar-EG', {
      year:'numeric', month:'2-digit', day:'2-digit'
    }) + ' ' + dt.toLocaleTimeString('ar-EG', {
      hour:'2-digit', minute:'2-digit'
    });
  } catch { return d; }
}

function timeAgo(d){
  if(!d) return '—';
  try {
    const diff = Date.now() - new Date(d).getTime();
    const mins = Math.floor(diff/60000);
    if(mins < 1) return 'الآن';
    if(mins < 60) return `منذ ${mins} دقيقة`;
    const hours = Math.floor(mins/60);
    if(hours < 24) return `منذ ${hours} ساعة`;
    const days = Math.floor(hours/24);
    if(days < 30) return `منذ ${days} يوم`;
    return fmtDate(d);
  } catch { return '—'; }
}

function daysBetween(date1, date2){
  if(!date1 || !date2) return 0;
  const d1 = new Date(date1);
  const d2 = new Date(date2);
  return Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24));
}

function validateWorkerMediaFile(file){
  const allowed = ['image/jpeg','image/png','image/webp'];

  if(!allowed.includes(file.type)){
    throw new Error(`الملف "${file.name}" غير مدعوم. المسموح JPG / PNG / WEBP`);
  }

  // نسمح باختيار صورة أصلية كبيرة نسبيًا ثم نضغطها قبل الرفع.
  const maxOriginal = 15 * 1024 * 1024;

  if(file.size > maxOriginal){
    throw new Error(`الملف "${file.name}" أكبر من 15MB ولا يمكن تجهيزه`);
  }
}

const WORKER_MEDIA_MAX_BYTES = 512 * 1024; // 0.5 MB

function loadImageForCompression(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };

    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error(`تعذر قراءة الصورة "${file.name}"`));
    };

    img.src = url;
  });
}

function canvasToJpegBlob(canvas, quality){
  return new Promise((resolve, reject) => {
    canvas.toBlob(
      blob => blob ? resolve(blob) : reject(new Error('تعذر ضغط الصورة')),
      'image/jpeg',
      quality
    );
  });
}

async function prepareWorkerMediaFile(file, mediaType){
  validateWorkerMediaFile(file);

  // إذا كانت أصلًا أقل من 0.5MB فلا نعيد ضغطها.
  if(file.size <= WORKER_MEDIA_MAX_BYTES){
    return file;
  }

  const img = await loadImageForCompression(file);

  // صور البطاقة تحتاج وضوحًا أعلى من الصورة الشخصية.
  const preferredMaxDimension =
    mediaType === 'profile_photo' ? 1200 : 1600;

  const sourceMax = Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height);
  let scale = Math.min(1, preferredMaxDimension / sourceMax);

  let width = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
  let height = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));

  // نحاول أولًا الحفاظ على الأبعاد، ثم نقللها تدريجيًا عند الحاجة.
  const qualities = [0.88, 0.82, 0.76, 0.70, 0.64, 0.58, 0.52];

  for(let resizeRound = 0; resizeRound < 5; resizeRound++){
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext('2d', { alpha: false });
    if(!ctx) throw new Error('تعذر تجهيز الصورة للضغط');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);
    ctx.drawImage(img, 0, 0, width, height);

    for(const quality of qualities){
      const blob = await canvasToJpegBlob(canvas, quality);

      if(blob.size <= WORKER_MEDIA_MAX_BYTES){
        const safeBase =
          (file.name || 'worker-image')
            .replace(/\.[^.]+$/, '')
            .replace(/[^\w\u0600-\u06FF\-]+/g, '_')
            .slice(0, 80) || 'worker-image';

        return new File(
          [blob],
          `${safeBase}.jpg`,
          { type: 'image/jpeg', lastModified: Date.now() }
        );
      }
    }

    width = Math.max(600, Math.round(width * 0.82));
    height = Math.max(400, Math.round(height * 0.82));
  }

  throw new Error(
    `تعذر ضغط الصورة "${file.name}" إلى أقل من 0.5MB مع الحفاظ على وضوح مناسب`
  );
}



const _workerMediaPending = new Map();

window.addEventListener('message', (event) => {
  try {
    const host = new URL(event.origin).hostname;
    const isGoogleScript =
      host === 'script.google.com' ||
      host === 'script.googleusercontent.com' ||
      host.endsWith('.googleusercontent.com');

    if(!isGoogleScript) return;
  } catch(_) {
    return;
  }

  const data = event.data || {};

  if(!data.requestId || !_workerMediaPending.has(data.requestId)){
    return;
  }

  const pending = _workerMediaPending.get(data.requestId);
  _workerMediaPending.delete(data.requestId);

  if(data.success){
    pending.resolve(data);
  } else {
    pending.reject(new Error(data.error || 'فشل رفع الملف'));
  }
});

function assertWorkerMediaAppsScriptReady(){
  const url = String(WORKER_MEDIA_APPS_SCRIPT_URL || '').trim();

  if(
    !url ||
    !url.startsWith('https://script.google.com/macros/s/') ||
    !url.endsWith('/exec')
  ){
    throw new Error('رابط Google Apps Script Web App غير مضبوط أو غير صالح');
  }
}

function fileToBase64Only(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      const value = String(reader.result || '');
      const comma = value.indexOf(',');

      if(comma < 0){
        reject(new Error('تعذر قراءة الملف'));
        return;
      }

      resolve(value.slice(comma + 1));
    };

    reader.onerror = () => reject(new Error('تعذر قراءة الملف'));
    reader.readAsDataURL(file);
  });
}

function postWorkerMediaForm(fields, targetName){
  const form = document.createElement('form');

  form.method = 'POST';
  form.action = WORKER_MEDIA_APPS_SCRIPT_URL;
  form.target = targetName;
  form.style.display = 'none';

  Object.entries(fields).forEach(([name, value]) => {
    const input = document.createElement(
      String(value || '').length > 100000 ? 'textarea' : 'input'
    );

    if(input.tagName === 'INPUT'){
      input.type = 'hidden';
      input.value = value ?? '';
    } else {
      input.value = value ?? '';
      input.style.display = 'none';
    }

    input.name = name;
    form.appendChild(input);
  });

  document.body.appendChild(form);
  form.submit();

  setTimeout(() => form.remove(), 1000);
}


function waitMs(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function getWorkerMediaMarker(workerId, mediaType){
  const { data, error } = await sb.from('individual_media')
    .select('drive_file_id, uploaded_at')
    .eq('individual_id', workerId)
    .eq('media_type', mediaType)
    .maybeSingle();

  if(error){
    throw new Error('تعذر التحقق من سجل الصورة: ' + error.message);
  }

  return data || null;
}

async function waitForWorkerMediaRegistration(workerId, mediaType, previousFileId, timeoutMs = 70000){
  const startedAt = Date.now();

  while(Date.now() - startedAt < timeoutMs){
    await waitMs(1400);

    const current = await getWorkerMediaMarker(workerId, mediaType);

    if(
      current?.drive_file_id &&
      current.drive_file_id !== previousFileId
    ){
      return current;
    }
  }

  throw new Error(
    'لم يصل تأكيد رفع الصورة خلال المهلة. افتح Google Apps Script > Executions لمعرفة سبب الرفض.'
  );
}

async function uploadWorkerMediaViaAppsScript(workerId, mediaType, file){
  assertWorkerMediaAppsScriptReady();

  const { data: { session: currentSession } } = await sb.auth.getSession();

  if(!currentSession?.access_token){
    throw new Error('انتهت جلسة الدخول');
  }

  // ضغط الصورة محليًا قبل تحويلها Base64 وإرسالها.
  const preparedFile = await prepareWorkerMediaFile(file, mediaType);

  // احفظ معرف النسخة الحالية حتى نعرف أن Apps Script سجّل نسخة جديدة فعلاً.
  const before = await getWorkerMediaMarker(workerId, mediaType);
  const previousFileId = before?.drive_file_id || null;

  const base64 = await fileToBase64Only(preparedFile);

  const requestId =
    'wm_' + Date.now() + '_' + Math.random().toString(36).slice(2);

  const iframeName = 'wm_iframe_' + requestId;
  const iframe = document.createElement('iframe');

  iframe.name = iframeName;
  iframe.style.display = 'none';
  document.body.appendChild(iframe);

  try {
    postWorkerMediaForm({
      action: 'upload',
      request_id: requestId,
      access_token: currentSession.access_token,
      individual_id: workerId,
      media_type: mediaType,
      original_name: file.name,
      mime_type: preparedFile.type,
      file_base64: base64
    }, iframeName);

    return await waitForWorkerMediaRegistration(
      workerId,
      mediaType,
      previousFileId
    );
  } finally {
    setTimeout(() => iframe.remove(), 2000);
  }
}

async function uploadWorkerMediaFiles(workerId, prefix){
  if(!canUploadWorkerMedia()) return 0;

  assertWorkerMediaAppsScriptReady();

  let uploaded = 0;

  const btnId = prefix === 'ew' ? 'ew_submit' : 'ai_submit';
  const btn = document.getElementById(btnId);

  for(const def of WORKER_MEDIA_DEFS){
    const input = document.getElementById(`${prefix}_${def.inputSuffix}`);
    const file = input?.files?.[0];

    if(!file) continue;

    if(btn){
      btn.disabled = true;
      btn.innerHTML =
        `<span class="spinner"></span> جارِ ضغط ورفع ${def.label}...`;
    }

    await uploadWorkerMediaViaAppsScript(workerId, def.key, file);
    uploaded++;
  }

  return uploaded;
}

async function issueAndPrintWorkerBadge(assignmentId){
  if(!canManageWorkerBadges()){
    return showToast('غير مصرح لك بإصدار بطاقة تعريفية', 'danger');
  }

  let popup = null;

  try {

      throw new Error('المتصفح منع فتح نافذة البطاقة');

      '<!doctype html><html lang="ar" dir="rtl"><body style="font-family:Arial;padding:30px">' +

/* ============  RPC Helper ============ */
async function callRPC(functionName, params = {}){
  try {
    const { data, error } = await sb.rpc(functionName, params);
    if(error){
      throw new Error(error.message || 'خطأ غير معروف');
    }
    return data;
  } catch(err){
    console.error(`RPC Error (${functionName}):`, err);
    throw err;
  }
}

/* ============  Modals Helper ============ */
function showModal(id, html){
  const container = document.getElementById('modals-container');
  const existing = document.getElementById(id);
  if(existing) existing.remove();
  
  const div = document.createElement('div');
  div.id = id;
  div.className = 'modal-overlay';
  div.innerHTML = html;
  div.onclick = (e) => { if(e.target === div) closeModal(id); };
  container.appendChild(div);
}

function closeModal(id){
  const el = document.getElementById(id);
  if(el) el.remove();
}

function closeAllModals(){
  document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
}

function exportToExcel(sheets, filename){
  if(typeof XLSX === 'undefined'){
    return showToast('مكتبة Excel لم تُحمّل', 'danger');
  }
  const wb = XLSX.utils.book_new();

function renderLoginScreen(){
  document.getElementById('app').innerHTML = `

          <div style="font-size:44px;margin-bottom:8px;">🗺️</div>

        </div>
        
        <div class="login-field">
          <label>كلمة المرور</label>
          <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
        </div>
        
        <button class="login-btn" id="btnLogin" onclick="doLogin()">
          🔐 تسجيل الدخول
        </button>
      </div>
    </div>
  `;
  
  document.getElementById('loginPass').addEventListener('keypress', e => {

  });

  });
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  
  if(!email || !password){
    return showToast('املأ البيانات كاملة', 'danger');
  }
  
  const btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> جارِ التحقق...';
  
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  
  if(error){
    btn.disabled = false;
    btn.innerHTML = '🔐 تسجيل الدخول';
    return showToast('بيانات الدخول غير صحيحة', 'danger');
  }
  
  session = data.session;
  await loadProfile();
}

async function doLogout(){
  if(!confirm('تسجيل الخروج؟')) return;
  await sb.auth.signOut();
  session = null;
  profile = null;
  location.reload();
}

/* ============ Load Profile ============ */
async function loadProfile(){
  const { data, error } = await sb.from('profiles')
    .select('*, profile_governorates(governorate_id)')
    .eq('id', session.user.id)
    .maybeSingle();
  
  if(error || !data){
    document.getElementById('app').innerHTML = `
      <div class="center-screen">
        <div class="card">
          <h2>⚠️ الحساب غير مُفعَّل</h2>
          <p>تم تسجيل الدخول لكن لا يوجد دور مرتبط بهذا الحساب. تواصل مع المشرف العام.</p>
          <button class="btn btn-outline" style="width:100%;" onclick="doLogout()">خروج</button>
        </div>
      </div>
    `;
    return;
  }
  
  if(data.is_active === false){
    document.getElementById('app').innerHTML = `
      <div class="center-screen">
        <div class="card">
          <h2>⛔ الحساب معطَّل</h2>
          <p>هذا الحساب تم تعطيله. تواصل مع المشرف العام.</p>
          <button class="btn btn-outline" style="width:100%;" onclick="doLogout()">خروج</button>
        </div>
      </div>
    `;
    return;
  }
  
  profile = data;
  
  // تحديث last_login_at
  sb.from('profiles')
    .update({ last_login_at: new Date().toISOString() })
    .eq('id', profile.id)
    .then(() => {});
  
  // تحميل المحافظات
  const { data: govs } = await sb.from('governorates').select('*').order('code');
  govList = govs || [];

  // تحميل الأقاليم الرسمية الأربعة وربطها بالمحافظات
  const { data: regionRows, error: regionsError } = await sb.from('regions')
    .select('id, code, name, region_governorates(governorate_id)')
    .order('id');

  if(!regionsError){
    regionsCache = regionRows || [];
    regionGovMap = {};
    regionsCache.forEach(r => {
      regionGovMap[String(r.id)] = (r.region_governorates || []).map(x => Number(x.governorate_id));
    });
  } else {
    regionsCache = [];
    regionGovMap = {};
    console.warn('Regions are not available:', regionsError.message);
  }
  
  // تحميل الأقسام
const { data: allDistricts } = await sb.from('districts')
  .select('id, governorate_id, name, center_code, center_name, vel_code, vel_name')
  .order('governorate_id')
  .order('center_code')
  .order('vel_code');
  
districtsCache = {};
(allDistricts || []).forEach(d => {
  const govId = d.governorate_id;
  if(!districtsCache[govId]) districtsCache[govId] = [];
  districtsCache[govId].push({
    id: d.id,
    name: d.vel_name || d.name,
    center: d.center_name,
    centerCode: d.center_code,
    velCode: d.vel_code
  });
});
  
  await refreshPendingCounts();
  renderApp();
}

async function refreshPendingCounts(){
  try {
    const { data } = await sb.from('v_pending_counts').select('*').maybeSingle();
    pendingCounts = data || {
      pending_seating: 0,
      pending_structure: 0,
      pending_edit_requests: 0,
      pending_workforce: 0
    };
  } catch(e) {
    pendingCounts = {
      pending_seating: 0,
      pending_structure: 0,
      pending_edit_requests: 0,
      pending_workforce: 0
    };
  }
  try {
    const { count } = await sb.from('individuals').select('id', {count:'exact', head:true}).not('requested_governorate_id', 'is', null);
    pendingCounts.pending_transfers = count || 0;
  } catch(e) {
    pendingCounts.pending_transfers = 0;
  }
}

/* ============ Navigation ============ */
function isNavActive(id){
  if(id === 'workers'){
    return ['workers','worker-detail'].includes(state.tab);
  }
  if(id === 'projects'){
    return ['projects','project-create','project-detail'].includes(state.tab);
  }
  if(id === 'governorates'){
    return ['governorates','governorate-detail'].includes(state.tab);
  }
  if(id === 'admin'){
    return ['admin','admin-users','admin-targets'].includes(state.tab);
  }
  return state.tab === id;
}

function renderNav(){
  const role = profile.role;
  const nav = [];

  const addSection = (label, cls = '') => {
    nav.push({ type:'section', label, cls });
  };

  const addItem = (id, label, icon, action, badge = 0) => {
    nav.push({ type:'item', id, label, icon, action, badge });
  };

  // ─────────────────────────────────────────────────────────────
  // المستوى العام
  // ─────────────────────────────────────────────────────────────
  addItem('dashboard', 'لوحة المتابعة', '📊', 'goToDashboard()');

  // ─────────────────────────────────────────────────────────────
  // القسم الرئيسي الأول: المشتغلون
  // ─────────────────────────────────────────────────────────────
  if(['admin','region','followup','office','committee'].includes(role)){
    addSection('القسم الأول — المشتغلون', 'domain workers-domain');
    addItem('workers', 'سجل المشتغلين', '👥', 'goToWorkers()');
  }

  // ─────────────────────────────────────────────────────────────
  // القسم الرئيسي الثاني: المشروعات
  // ─────────────────────────────────────────────────────────────
  const canSeeProjectsList = ['admin','region','followup'].includes(role);
  const canSeeProjectOps = ['admin','region','followup','office','project_manager'].includes(role);
  const canSeePayments = ['admin','region','followup'].includes(role);

  if(canSeeProjectsList || canSeeProjectOps || canSeePayments){
    addSection('القسم الثاني — المشروعات', 'domain projects-domain');

    if(canSeeProjectsList){
      addItem('projects', 'قائمة المشروعات', '📁', 'goToProjects()');
    }

    if(canSeeProjectOps){
      addItem('assignments', 'التسكينات', '🔗', 'goToAssignments()');
      addItem('units', 'وحدات العمل', '📦', 'goToUnits()');
      addItem('performance', 'الإنجاز اليومي', '📈', 'goToPerformance()');
      addItem('training', 'التدريب', '🎓', 'goToTraining()');
    }

    if(canSeePayments){
      addItem('payments', 'المكافآت والتصفية', '💰', 'goToPayments()');
    }
  }

  // ─────────────────────────────────────────────────────────────
  // خدمات مشتركة بين المشتغلين والمشروعات
  // ─────────────────────────────────────────────────────────────
  const sharedItems = [];

  if(['admin','region','followup','office'].includes(role)){
    sharedItems.push({
      id:'governorates', label:'المحافظات', icon:'🏛️',
      action:'goToGovernorates()', badge:0
    });
  }

  if(['admin','region'].includes(role)){
    const totalRequests =
      (pendingCounts.pending_seating || 0) +
      (pendingCounts.pending_structure || 0) +
      (pendingCounts.pending_edit_requests || 0);

    sharedItems.push({
      id:'requests', label:'مركز الطلبات', icon:'📋',
      action:'goToRequests()', badge:totalRequests
    });
  }

  if(role === 'region'){
    sharedItems.push({
      id:'seating-requests', label:'طلبات التسكين', icon:'✋',
      action:'goToSeatingRequests()', badge:pendingCounts.pending_seating || 0
    });
  }

  if(['admin','project_manager','region','office'].includes(role)){
    sharedItems.push({
      id:'exceptions', label:'الاستثناءات', icon:'⚠️',
      action:'goToExceptions()', badge:0
    });
    sharedItems.push({
      id:'conflicts', label:'التعارضات', icon:'🔴',
      action:'goToConflicts()', badge:0
    });
  }

  if(sharedItems.length){
    addSection('المتابعة والخدمات المشتركة', 'support-domain');
    sharedItems.forEach(it => addItem(
      it.id, it.label, it.icon, it.action, it.badge
    ));
  }

  // ─────────────────────────────────────────────────────────────
  // إدارة النظام
  // ─────────────────────────────────────────────────────────────
  if(role === 'admin'){
    addSection('إدارة النظام', 'support-domain');
    addItem('admin', 'الإدارة والصلاحيات', '⚙️', 'goToAdmin()');
    addItem('audit', 'سجل الإجراءات', '📜', 'goToAudit()');
  }

  // رسم القائمة
  document.getElementById('navList').innerHTML = nav.map(it => {
    if(it.type === 'section'){
      return `<div class="nav-section ${it.cls || ''}">${esc(it.label)}</div>`;
    }

    const active = isNavActive(it.id);
    const badge = it.badge
      ? `<span class="badge-count">${it.badge}</span>`
      : '';

    return `
      <button class="nav-btn ${active ? 'active' : ''}" onclick="${it.action}">
        ${it.icon} <span>${esc(it.label)}</span> ${badge}
      </button>
    `;
  }).join('');
}

function setBreadcrumb(parts){
  document.getElementById('breadcrumb').innerHTML = parts.map((p, i) => {
    if(i === parts.length - 1){
      return `<strong style="color:var(--ink);">${esc(p.label)}</strong>`;
    }
    if(p.action){
      return `<a onclick="${p.action}">${esc(p.label)}</a>`;
    }
    return `<span>${esc(p.label)}</span>`;
  }).join('<span class="sep">›</span>');
}

    'exceptions': renderExceptions,
    'conflicts': renderConflicts
  };
 
  
  const fn = routes[state.tab] || renderDashboard;
  
  try {
    await fn();
  } catch(err){
    console.error('Route error:', err);
    showError('content', err.message || 'خطأ في تحميل الشاشة');
  }
}

async function populateProjectPicker(){
  const { data: projects } = await sb.from('projects')
    .select('id, name')
    .order('created_at', { ascending: false });
  
  const sel = document.getElementById('activeProjectSelect');
  if(!sel) return;
  
  const list = projects || [];
  if(list.length === 0){
    sel.innerHTML = '<option value="">لا توجد مشاريع</option>';
    return;
  }
  
  if(!state.activeProjectId) state.activeProjectId = list[0].id;
  
  sel.innerHTML = list.map(p => `
    <option value="${p.id}" ${p.id === state.activeProjectId ? 'selected' : ''}>
      ${esc(p.name)}
    </option>
  `).join('');
}

function setActiveProject(id){
  state.activeProjectId = id;
  state.activeProjectCache = null;
  route();
}

async function renderGovernorates(){
  const c = document.getElementById('content');
  showLoading('content', 'جارِ تحميل المحافظات...');
  
  try {
    const govs = visibleGovs();
    if(govs.length === 0){
      c.innerHTML = `
        <div class="empty-rich">
          <div class="icon">🏛️</div>
          <h3>لا توجد محافظات متاحة</h3>
          <p>تواصل مع المشرف العام لتعيين المحافظات المسموحة لك.</p>
        </div>
      `;
      return;
    }
    
    // جلب الإحصائيات
    const govIds = govs.map(g => g.id);
    
    const [{ data: inds }, { data: pg }] = await Promise.all([
      sb.from('individuals').select('governorate_id, status').in('governorate_id', govIds),
      sb.from('project_governorates').select('governorate_id').in('governorate_id', govIds)
    ]);
    
    const indCount = {};
    (inds || []).forEach(r => {
      if(['active','approved','assigned'].includes(r.status)){
        indCount[r.governorate_id] = (indCount[r.governorate_id] || 0) + 1;
      }
    });
    
    const projCount = {};
    (pg || []).forEach(r => {
      projCount[r.governorate_id] = (projCount[r.governorate_id] || 0) + 1;
    });
    
    c.innerHTML = `
      <p class="section-hint">اختر محافظة للدخول إلى قوائم المرشحين والمشروعات.</p>
      
      <div class="grid cols-4">
        ${govs.map(g => `
          <div class="card" style="cursor:pointer;" onclick="openGovernorate(${g.id})">
            <div class="flex-between" style="margin-bottom:10px;">

              <span class="nums" style="color:var(--teal);font-weight:800;">
                ${indCount[g.id] || 0}
              </span> مشتغل
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } catch(err) {
    showError('content', err.message);
  }
}

function renderWorkersResultsArea(){
  const area = document.getElementById('workersResultsArea');
  if(!area) return; // المستخدم غادر الشاشة قبل انتهاء المؤقّت
  const all = _workersAllCache;

  let filtered = all;
  if(state.workerFilter !== 'all'){
    filtered = filtered.filter(w => w.status === state.workerFilter);
  }
  if(state.workerGovFilter !== 'all'){
    filtered = filtered.filter(w => w.governorate_id === parseInt(state.workerGovFilter));
  }
  if(state.workerProjectFilter !== 'all'){
    filtered = filtered.filter(w => w.current_project_id === state.workerProjectFilter);
  }
  if(state.workerTypeFilter !== 'all'){
    filtered = filtered.filter(w => w.contract_type === state.workerTypeFilter);
  }
  if(state.workerSearch.trim()){
    const tempS = state.workerSearch.trim();
    filtered = filtered.filter(w =>
      (w.full_name || '').includes(tempS)||
      (w.national_id || '').includes(tempS) ||
      (w.phone || '').includes(tempS) ||
      (w.username || '').includes(tempS)
    );
  }

  const totalPages = Math.max(1, Math.ceil(filtered.length / WORKERS_PAGE_SIZE));
  if(state.workerPage > totalPages) state.workerPage = totalPages;
  const pageItems = filtered.slice(
    (state.workerPage - 1) * WORKERS_PAGE_SIZE,
    state.workerPage * WORKERS_PAGE_SIZE
  );

  area.innerHTML = `
    <div class="subtle" style="margin-bottom:12px;">
      ${filtered.length} نتيجة من ${all.length} مشتغل
    </div>

    ${pageItems.length === 0 ? `
      <div class="empty-rich">
        <div class="icon">👥</div>
        <h3>لا توجد نتائج</h3>
        <p>جرّب تعديل الفلاتر أو البحث بكلمة أخرى.</p>
      </div>
    ` : `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>الاسم</th>
              <th>الرقم القومي</th>
              <th>المحافظة</th>
              <th>النوع</th>
              <th>الحالة</th>
              <th>المشروع الحالي</th>
              <th>الكود</th>
              <th>الهاتف</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${pageItems.map(w => `
              <tr style="cursor:pointer;" onclick="openWorker('${w.id}')">
                <td>
                  <strong>${esc(w.full_name)}</strong>
                  ${w.username ? `<br><span class="subtle nums">(${esc(w.username)})</span>` : ''}
                </td>
                <td class="nums subtle">${esc(w.national_id)}</td>
                <td class="subtle">${esc(w.governorate_name || '—')}</td>
                <td>${contractBadge(w.contract_type)}</td>
                <td onclick="event.stopPropagation()">
                  ${profile.role==='admin' ? `
                    <select class="filter-select" style="font-size:12px;padding:4px 6px;"
                            onchange="inlineSetWorkerStatus('${w.id}', this.value)">
                      ${['pending','active','inactive','rejected','archived']
                        .map(s=>`<option value="${s}" ${s===w.status?'selected':''}>${statusAr(s)}</option>`).join('')}
                    </select>
                  ` : statusBadge(w.status)}
                </td>
                <td class="subtle">${esc(w.current_project_name || '—')}</td>
                <td class="nums subtle">${esc(w.slot_code || '—')}</td>
                <td class="nums subtle text-left">${esc(w.phone || '—')}</td>
                <td>
                  <button class="link-btn" onclick="event.stopPropagation(); openWorker('${w.id}')">
                    عرض
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>

      ${totalPages > 1 ? `
        <div style="display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px;">
          <button class="btn btn-outline btn-sm" 
                  onclick="setWorkerPage(${state.workerPage-1})" 
                  ${state.workerPage<=1?'disabled':''}>
            ← السابق
          </button>
          <span class="nums">صفحة ${state.workerPage} من ${totalPages}</span>
          <button class="btn btn-outline btn-sm" 
                  onclick="setWorkerPage(${state.workerPage+1})" 
                  ${state.workerPage>=totalPages?'disabled':''}>
            التالي →
          </button>
        </div>
      ` : ''}
    `}
  `;
}

function setWorkerFilter(f){ state.workerFilter = f; state.workerPage = 1; renderWorkersResultsArea(); }
function setWorkerSearch(s){
  state.workerSearch = s;
  state.workerPage = 1;
  clearTimeout(window._wst);
  // تحديث خفيف من البيانات المخزّنة محليًا فقط — مفيش إعادة بناء لمربع البحث نفسه إطلاقًا
  window._wst = setTimeout(() => renderWorkersResultsArea(), 200);
}
function setWorkerGov(g){ state.workerGovFilter = g; state.workerPage = 1; renderWorkersResultsArea(); }
function setWorkerProject(p){ state.workerProjectFilter = p; state.workerPage = 1; renderWorkersResultsArea(); }
function setWorkerType(t){ state.workerTypeFilter = t; state.workerPage = 1; renderWorkersResultsArea(); }
function setWorkerPage(p){ state.workerPage = p; renderWorkersResultsArea(); }

/* ============ Committee interview request ============ */
async function openWorkerInterviewRequest(workerId){
  if(!canManageWorkerInterview()) return showToast('هذه الصلاحية مخصصة للجنة المقابلة', 'danger');
  const { data: w, error } = await sb.from('v_workers_registry')
    .select('id, full_name, interview_done, interview_notes')
    .eq('id', workerId)
    .maybeSingle();
  if(error || !w) return showToast('تعذر تحميل بيانات المشتغل', 'danger');

  showModal('committeeInterviewModal', `
    <div class="modal-box">
      <h3>📝 نتيجة المقابلة</h3>
      <p class="sub"><strong>${esc(w.full_name)}</strong> — يمكن للجنة تعديل بيانات المقابلة فقط، ويتم إرسالها للاعتماد.</p>
      <div class="field" style="margin-bottom:14px;">
        <label>موقف المقابلة</label>
        <select id="ci_done">
          <option value="false" ${!w.interview_done?'selected':''}>لم تتم</option>
          <option value="true" ${w.interview_done?'selected':''}>تمت</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label>ملاحظات المقابلة</label>
        <textarea id="ci_notes" rows="4">${esc(w.interview_notes || '')}</textarea>
      </div>
      <div class="flex-end">
        <button class="btn btn-outline" onclick="closeModal('committeeInterviewModal')">إلغاء</button>
        <button class="btn btn-primary" id="ci_submit" onclick="submitWorkerInterviewRequest('${workerId}')">📤 إرسال للاعتماد</button>
      </div>
    </div>
  `);
}
async function submitWorkerInterviewRequest(workerId){
  if(!canManageWorkerInterview()) return showToast('غير مصرح', 'danger');
  const done = document.getElementById('ci_done').value === 'true';
  const notes = document.getElementById('ci_notes').value.trim();
  const btn = document.getElementById('ci_submit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> جارِ الإرسال...';
  try {
    const { error } = await sb.from('individual_edit_requests').insert({
      individual_id: workerId,
      requested_by: profile.id,
      changes: { interview_done: done, interview_notes: notes || null },
      status: 'pending'
    });
    if(error) throw error;
    closeModal('committeeInterviewModal');
    showToast('✅ تم إرسال نتيجة المقابلة للمراجعة والاعتماد', 'success');
  } catch(err) {
    showToast(err.message, 'danger');
    btn.disabled = false;
    btn.innerHTML = '📤 إرسال للاعتماد';
  }
}

function inferRegionIdFromGovernorates(govIds){
  const target = [...(govIds || [])].map(Number).sort((a,b)=>a-b);
  for(const region of regionsCache){
    const ids = [...(regionGovMap[String(region.id)] || [])].map(Number).sort((a,b)=>a-b);
    if(ids.length === target.length && ids.every((id, idx) => id === target[idx])){
      return String(region.id);
    }
  }
  return '';
}

function applyUserRegionSelection(regionId){
  const ids = regionGovMap[String(regionId)] || [];
  const allowed = new Set(ids.map(Number));

  document.querySelectorAll('.uf-gov-cb').forEach(cb => {
    cb.checked = allowed.has(Number(cb.value));
  });

  const summary = document.getElementById('uf_region_summary');
  if(summary){
    const names = govList.filter(g => allowed.has(Number(g.id))).map(g => g.name);
    summary.textContent = names.length
      ? `المحافظات التابعة تلقائياً: ${names.join('، ')}`
      : 'لا توجد محافظات مرتبطة بهذا الإقليم.';
  }
}

function toggleUserGovs(){
  const role = document.getElementById('uf_role')?.value;
  const govWrap = document.getElementById('uf_govs_wrap');
  const regionWrap = document.getElementById('uf_region_wrap');
  const hint = document.getElementById('uf_govs_hint');
  if(!govWrap || !regionWrap) return;

  if(role === 'region'){
    regionWrap.style.display = 'block';
    govWrap.style.display = 'none';
    const regionId = document.getElementById('uf_region')?.value;
    if(regionId) applyUserRegionSelection(regionId);
    return;
  }

  regionWrap.style.display = 'none';

  if(['admin','followup','project_manager'].includes(role)){
    govWrap.style.display = 'none';
    return;
  }

  govWrap.style.display = 'block';
  if(hint){
    hint.textContent = role === 'office'
      ? '⚠️ مسؤول المحافظة: اختر محافظة واحدة فقط'
      : 'اختر محافظة واحدة على الأقل';
  }
}

function generatePassword(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  let pwd = '';
  for(let i = 0; i < 10; i++){
    pwd += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return pwd;
}

async function submitUserForm(mode, userId){
  const name = document.getElementById('uf_name').value.trim();
  const role = document.getElementById('uf_role').value;
  const regionId = document.getElementById('uf_region')?.value || '';

  if(role === 'region'){
    if(!regionId) return showToast('اختر الإقليم الرسمي', 'danger');
    applyUserRegionSelection(regionId);
  }

  const govIds = Array.from(document.querySelectorAll('.uf-gov-cb:checked'))
    .map(c => parseInt(c.value));
  
  if(!name) return showToast('الاسم مطلوب', 'danger');
  if(['region','office','committee'].includes(role) && govIds.length === 0){
    return showToast(
      role === 'region' ? 'الإقليم المختار لا يحتوي محافظات' : 'اختر محافظة واحدة على الأقل',
      'danger'
    );
  }
  if(role === 'office' && govIds.length > 1){
    return showToast('مسؤول المحافظة يُخصص لمحافظة واحدة فقط', 'danger');
  }
  
  const btn = document.getElementById('uf_submit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> جارِ الحفظ...';
  
  try {
    if(mode === 'add'){
      const email = document.getElementById('uf_email').value.trim();
      const password = document.getElementById('uf_password').value;
      
      if(!email) throw new Error('البريد الإلكتروني مطلوب');
      if(!password || password.length < 6) throw new Error('كلمة المرور 6 أحرف على الأقل');
      
      const result = await sb.functions.invoke('admin-create-user', {
        body: {
          email, password,
          full_name: name,
          role,
          governorate_ids: govIds
        }
      });
      
      if(result.error) throw new Error(result.error.message || 'فشل الإنشاء');
      if(!result.data?.success) throw new Error(result.data?.error || 'فشل الإنشاء');
      
      showToast('✅ تم إنشاء المستخدم بنجاح', 'success');
    } else {
      const { error: e1 } = await sb.from('profiles')
        .update({
          full_name: name,
          role,
          updated_at: new Date().toISOString(),
          updated_by: profile.id
        })
        .eq('id', userId);
      
      if(e1) throw new Error(e1.message);
      
      await sb.from('profile_governorates').delete().eq('profile_id', userId);
      
      if(['region','office','committee'].includes(role) && govIds.length){
        const rows = govIds.map(gid => ({
          profile_id: userId,
          governorate_id: gid
        }));
        const { error: e2 } = await sb.from('profile_governorates').insert(rows);
        if(e2) throw new Error(e2.message);
      }
      
      await sb.from('audit_log').insert({
        actor_id: profile.id,
        action: 'update_user',
        target_id: userId,
        target_type: 'profiles',
        details: { role, region_id: role === 'region' ? Number(regionId) : null, governorate_ids: govIds }
      });
      
      showToast('✅ تم حفظ التعديلات', 'success');
    }
    
    closeModal('userFormModal');
    await refreshPendingCounts();
    route();
  } catch(err) {
    showToast(err.message, 'danger');
    btn.disabled = false;
    btn.innerHTML = mode === 'add' ? '➕ إنشاء المستخدم' : '💾 حفظ التعديلات';
  }
}

    });
    showToast(`✅ تم ${action} المستخدم`, 'success');
    route();
  } catch(err) {
    showToast(err.message, 'danger');
  }
}

    const { data: govs, error } = await sb.from('governorates').select('*').order('code');
    if(error) throw error;
    
    // جلب عدد المتقدمين لكل محافظة
    const { data: inds } = await sb.from('individuals').select('governorate_id');
    const counts = {};
    (inds || []).forEach(i => {
      counts[i.governorate_id] = (counts[i.governorate_id] || 0) + 1;
    });
    
    c.innerHTML = `
      <div class="flex-between" style="margin-bottom:16px;">
        <div>
          <h2 style="margin:0;font-size:20px;">🎯 المستهدفات</h2>
          <div class="subtle" style="margin-top:4px;">عدّل المستهدف لكل محافظة</div>
        </div>
        <button class="btn btn-outline" onclick="exportTargetsExcel()">⬇ تصدير Excel</button>
      </div>
      
      <div class="card" style="padding:0;overflow:hidden;">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>الكود</th>
                <th>المحافظة</th>
                <th>المستهدف</th>
                <th>عدد المتقدمين</th>
                <th>النسبة</th>
                <th>إجراء</th>
              </tr>
            </thead>
            <tbody>
              ${(govs||[]).map(g => {
                const count = counts[g.id] || 0;
                const target = g.target || 0;
                const pct = target > 0 ? Math.round(count / target * 100) : 0;
                
                return `
                  <tr>
                    <td class="nums subtle">${esc(g.code)}</td>
                    <td><strong>${esc(g.name)}</strong></td>
                    <td>
                      <input type="number" min="0" value="${target}" 
                             id="tg_${g.id}"
                             style="width:100px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;text-align:center;">
                    </td>
                    <td class="nums">${count}</td>
                    <td>
                      <span class="badge ${pct >= 100 ? 'badge-success' : pct >= 50 ? 'badge-amber' : 'badge-muted'}">
                        ${pct}%
                      </span>
                    </td>
                    <td>
                      <button class="btn btn-primary btn-sm" onclick="saveTarget(${g.id})">
                        💾 حفظ
                      </button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  } catch(err) {
    showError('content', err.message);
  }
}

async function saveTarget(id){
  const val = parseInt(document.getElementById('tg_' + id).value) || 0;
  const { error } = await sb.from('governorates').update({ target: val }).eq('id', id);
  if(error) return showToast('تعذر: ' + error.message, 'danger');
  showToast('✅ تم الحفظ', 'success');
}

function exportTargetsExcel(){
  sb.from('governorates').select('*').order('code').then(({data}) => {
    const rows = (data||[]).map(g => ({
      'الكود': g.code,
      'المحافظة': g.name,
      'المستهدف': g.target || 0
    }));
    exportToExcel([{name:'المستهدفات', rows}], 'المستهدفات.xlsx');
  });
}

async function submitAddIndividual(){
  if(!canCreateWorker()) return showToast('غير مصرح لك بإضافة مشتغلين', 'danger');
  const name = document.getElementById('ai_name').value.trim();
  const nid = document.getElementById('ai_nid').value.trim();
  const nidExpiry = document.getElementById('ai_nid_expiry').value;
  const phone = document.getElementById('ai_phone').value.trim();
  const phone2 = document.getElementById('ai_phone2').value.trim();
  const gender = document.getElementById('ai_gender').value;
  const contractType = document.getElementById('ai_type').value;
  const empCode = document.getElementById('ai_empcode').value.trim();
  const govId = document.getElementById('ai_gov').value;
  const address = document.getElementById('ai_address').value.trim();
  const qual = document.getElementById('ai_qual').value;
  const college = document.getElementById('ai_college').value.trim();
  const spec = document.getElementById('ai_spec').value.trim();
  const gradYear = document.getElementById('ai_grad_year').value.trim();
  const outRes = _yn(document.getElementById('ai_outres').value);
  const outGov = _yn(document.getElementById('ai_outgov').value);
  const holidays = _yn(document.getElementById('ai_holidays').value);
  const avail = _yn(document.getElementById('ai_avail').value);
  const health = document.getElementById('ai_health').value.trim();
  const interviewDone = document.getElementById('ai_interview_done').value === 'true';
  const interviewNotes = document.getElementById('ai_interview_notes').value.trim();

  if(!name) return showToast('الاسم مطلوب', 'danger');
  if(!/^[23][0-9]{13}$/.test(nid)) return showToast('الرقم القومي غير صحيح', 'danger');
  if(!nidExpiry) return showToast('تاريخ انتهاء بطاقة الرقم القومي مطلوب', 'danger');
  if(!/^01[0125][0-9]{8}$/.test(phone)) return showToast('رقم الهاتف غير صحيح', 'danger');
  if(!gender) return showToast('النوع مطلوب', 'danger');
  if(!contractType) return showToast('نوع التعاقد مطلوب', 'danger');
  if(!govId) return showToast('اختر المحافظة', 'danger');
  if(!address) return showToast('عنوان السكن بالتفصيل مطلوب', 'danger');
  if(!qual) return showToast('نوع المؤهل مطلوب', 'danger');
  if(!spec) return showToast('التخصص مطلوب', 'danger');
  if(!gradYear) return showToast('سنة التخرج مطلوبة', 'danger');

  const btn = document.getElementById('ai_submit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> جارِ الإضافة...';

  try {
    const workerId = await callRPC('admin_create_individual', {
      p_national_id: nid,
      p_full_name: name,
      p_phone: phone,
      p_phone2: phone2 || null,
      p_gender: gender,
      p_contract_type: contractType,
      p_governorate_id: parseInt(govId),
      p_address: address,
      p_qualification: qual,
      p_specialization: spec,
      p_grad_year: gradYear,
      p_internal_employee_code: empCode || null,
      p_college: college || null,
      p_can_work_outside_residence: outRes,
      p_can_work_outside_governorate: outGov,
      p_can_work_holidays: holidays,
      p_fully_available: avail,
      p_health_note: health || null,
      p_interview_done: interviewDone,
      p_interview_notes: interviewNotes || null,
      p_national_id_expiry_date: nidExpiry
    });

    let mediaUploaded = 0;
    let mediaWarning = '';

    if(workerId && workerMediaHasFiles('ai')){
      try {
        mediaUploaded = await uploadWorkerMediaFiles(workerId, 'ai');
      } catch(mediaErr) {
        mediaWarning = mediaErr.message;
      }
    }

    closeModal('addIndividualModal');

    if(mediaWarning){
      showToast(`✅ تم إنشاء المشتغل، لكن تعذر رفع بعض الصور: ${mediaWarning}`, 'danger');
    } else {
      showToast(`✅ تمت الإضافة، بانتظار موافقة الأدمن${mediaUploaded ? ` · تم رفع ${mediaUploaded} ملف` : ''}`, 'success');
    }

    route();
  } catch(err) {
    showToast(err.message, 'danger');
    btn.disabled = false;
    btn.innerHTML = '💾 إضافة';
  }
}

function onSlotChange(){
  const sel = document.getElementById('assignSlot');
  const opt = sel.options[sel.selectedIndex];
  const role = opt?.dataset?.role || '';
  document.getElementById('assignRole').value = role ? slotRoleAr(role) : '';
}

  return `

        ${units.map(u => `

              ${u.metadata && Object.keys(u.metadata).length > 0 ? `

function filterUnits(){
  const status = document.getElementById('unitStatusFilter').value;
  const search = document.getElementById('unitSearch').value.trim();
  
  document.querySelectorAll('.unit-row').forEach(row => {
    const rowStatus = row.dataset.status;
    const rowCode = row.dataset.code;
    
    let show = true;
    if(status !== 'all' && rowStatus !== status) show = false;
    if(search && !rowCode.includes(search)) show = false;
    
    row.style.display = show ? '' : 'none';
  });
}

async function submitCreateUnit(){
  const code = document.getElementById('unitCode').value.trim();
  const type = document.getElementById('unitType').value;
  const metadataStr = document.getElementById('unitMetadata').value.trim();
  
  if(!code) return showToast('كود الوحدة مطلوب', 'danger');
  
  let metadata = {};
  if(metadataStr){
    try {
      metadata = JSON.parse(metadataStr);
    } catch {
      return showToast('صيغة JSON غير صحيحة', 'danger');
    }
  }
  
  try {
    const { error } = await sb.from('work_units').insert({
      project_id: state.activeProjectId,
      governorate_id: state.activeGovId,
      unit_type: type,
      unit_code: code,
      status: 'pending',
      metadata: metadata
    });
    
    if(error) throw error;
    
    closeModal('createUnitModal');
    showToast('✅ تم إضافة الوحدة', 'success');
    renderUnits();
  } catch(err) {
    showToast(err.message, 'danger');
  }
}

function downloadUnitsTemplate(){
  if(typeof XLSX === 'undefined') return showToast('مكتبة Excel لم تُحمّل', 'danger');
  const template = [
    { unit_code: 'FAM-001', unit_type: 'family', metadata: '{"head_name":"أحمد"}' },
    { unit_code: 'FAM-002', unit_type: 'family', metadata: '' },
    { unit_code: 'FAM-003', unit_type: 'family', metadata: '' }
  ];
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(template);
  XLSX.utils.book_append_sheet(wb, ws, 'الوحدات');
  XLSX.writeFile(wb, 'نموذج_وحدات_العمل.xlsx');
  showToast('✅ تم تحميل النموذج', 'success');
}

async function handleUnitsFile(file){
  if(!file) return;
  if(!file.name.match(/\.(xlsx|xls)$/i)){
    return showToast('صيغة الملف غير مدعومة', 'danger');
  }
  
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(e.target.result, {type: 'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval: ''});
      
      if(rows.length === 0) return showToast('الملف فارغ', 'danger');
      
      const validRows = rows.filter(r => r.unit_code && r.unit_type);
      const invalidRows = rows.filter(r => !r.unit_code || !r.unit_type);
      
      if(validRows.length === 0){
        return showToast('لا توجد صفوف صالحة', 'danger');
      }
      
      if(!confirm(`سيتم استيراد ${validRows.length} وحدة.\n${invalidRows.length > 0 ? `تم تجاهل ${invalidRows.length} صف غير صالح.\n` : ''}هل أنت متأكد؟`)){
        return;
      }
      
      const insertRows = validRows.map(r => ({
        project_id: state.activeProjectId,
        governorate_id: state.activeGovId,
        unit_type: r.unit_type,
        unit_code: String(r.unit_code).trim(),
        status: 'pending',
        metadata: r.metadata 
          ? (typeof r.metadata === 'string' ? JSON.parse(r.metadata) : r.metadata) 
          : {}
      }));
      
      const { error } = await sb.from('work_units').insert(insertRows);
      if(error) throw error;
      
      closeModal('importUnitsModal');
      showToast(`✅ تم استيراد ${validRows.length} وحدة`, 'success');
      renderUnits();
    } catch(err) {
      showToast('خطأ في قراءة الملف: ' + err.message, 'danger');
    }
  };
  reader.readAsArrayBuffer(file);
}

async function submitAttendance(){
  const date = document.getElementById('attDate').value;
  if(!date) return showToast('التاريخ مطلوب', 'danger');
  
  const selects = document.querySelectorAll('.att-status');
  let successCount = 0;
  let errorCount = 0;
  
  for(const sel of selects){
    try {
      await callRPC('record_training_attendance', {
        p_project_id: state.activeProjectId,
        p_individual_id: sel.dataset.id,
        p_date: date,
        p_status: sel.value,
        p_absence_reason: null,
        p_deduction_amount: 0
      });
      successCount++;
    } catch(err) {
      errorCount++;
    }
  }
  
  closeModal('recordAttendanceModal');
  showToast(`✅ تم تسجيل ${successCount} حضور${errorCount > 0 ? ` (فشل ${errorCount})` : ''}`, 'success');
  renderTraining();
}

async function submitPayment(){
  const individualId = document.getElementById('payIndividual').value;
  const category = document.getElementById('payCategory').value;
  const amount = parseFloat(document.getElementById('payAmount').value);
  const paidDate = document.getElementById('payDate').value;
  const label = document.getElementById('payLabel').value.trim() || null;
  const notes = document.getElementById('payNotes').value.trim() || null;
  
  if(!individualId) return showToast('اختر الفرد', 'danger');
  if(!amount || amount <= 0) return showToast('المبلغ مطلوب', 'danger');
  if(!paidDate) return showToast('التاريخ مطلوب', 'danger');
  
  try {
    const { error } = await sb.from('payments').insert({
      project_id: state.activeProjectId,
      individual_id: individualId,
      category,
      amount,
      paid_date: paidDate,
      installment_label: label,
      notes,
      status: 'paid',
      created_by: profile.id
    });
    
    if(error) throw error;
    
    closeModal('addPaymentModal');
    showToast('✅ تم تسجيل الدفعة', 'success');
    renderPayments();
  } catch(err) {
    showToast(err.message, 'danger');
  }
}

function exportPaymentsExcel(){
  sb.from('payments')
    .select('*, individuals(full_name), projects(name)')
    .eq('project_id', state.activeProjectId)
    .then(({ data }) => {
      const rows = (data || []).map(p => ({
        'التاريخ': fmtDate(p.paid_date),
        'الفرد': p.individuals?.full_name || '',
        'المشروع': p.projects?.name || '',
        'النوع': p.category || '',
        'الدفعة': p.installment_label || '',
        'المبلغ': p.amount || 0,
        'الحالة': p.status || '',
        'ملاحظات': p.notes || ''
      }));
      exportToExcel([{ name: 'المدفوعات', rows }], 'المدفوعات.xlsx');
    });
}

/* ============ Projects List ============ */
async function loadProjectsDashboardLegacy(){
  const { data: projects, error } = await sb.from('projects')
    .select('id, name, code, start_date, end_date, status, created_at')
    .order('created_at', {ascending: false});

  if(error) throw error;

  const rows = await Promise.all((projects || []).map(async p => {
    const [slots, filled, pg, pm, assign, pay, units, done] = await Promise.all([
      sb.from('structure_slots').select('id', {count:'exact', head:true}).eq('project_id', p.id),
      sb.from('structure_slots').select('id', {count:'exact', head:true}).eq('project_id', p.id).eq('status', 'filled'),
      sb.from('project_governorates').select('governorate_id').eq('project_id', p.id),
      sb.from('project_managers').select('profile_id, profiles(full_name)').eq('project_id', p.id),
      sb.from('assignments').select('id', {count:'exact', head:true}).eq('project_id', p.id).eq('status', 'active'),
      sb.from('payments').select('amount').eq('project_id', p.id).eq('status', 'paid'),
      sb.from('work_units').select('id', {count:'exact', head:true}).eq('project_id', p.id),
      sb.from('work_units').select('id', {count:'exact', head:true}).eq('project_id', p.id).eq('status', 'completed')
    ]);

    const totalPaid = (pay.data || []).reduce((s, x) => s + parseFloat(x.amount || 0), 0);
    const totalUnits = units.count || 0;
    const completedUnits = done.count || 0;

    return {
      ...p,
      slots: slots.count || 0,
      filled: filled.count || 0,
      govs: (pg.data || []).length,
      managers: (pm.data || []).map(m => m.profiles?.full_name).filter(Boolean),
      assignments: assign.count || 0,
      totalPaid,
      units: totalUnits,
      completedUnits,
      completionPct: totalUnits > 0 ? Math.round(completedUnits / totalUnits * 100) : 0
    };
  }));

  return rows;
}

async function loadProjectsDashboard(){
  try {
    const data = await callRPC('get_projects_dashboard');
    if(!Array.isArray(data)) throw new Error('RPC returned an unexpected result');
    return data;
  } catch(err) {
    console.warn('get_projects_dashboard unavailable; using legacy fallback:', err);
    return await loadProjectsDashboardLegacy();
  }
}

async function commitProject(){
  const btn = document.getElementById('btnCommitProject');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> جارِ الإنشاء...';
  
  const d = wizard.data;
  const code = 'PRJ-' + Date.now().toString(36).toUpperCase();
  
  try {
    // 1) إنشاء المشروع
    const { data: proj, error: e1 } = await sb.from('projects').insert({
      code,
      name: d.name,
      description: d.description || null,
      requesting_entity: d.requesting_entity || null,
      start_date: d.start_date,
      end_date: d.end_date,
      status: 'active',
      created_by: profile.id
    }).select().single();
    
    if(e1) throw new Error('تعذر إنشاء المشروع: ' + e1.message);
    
    // 2) ربط المحافظات
    const pgRows = d.govIds.map(gid => ({
      project_id: proj.id,
      governorate_id: gid,
      target_supervisors: d.plan[gid].supervisors,
      target_reviewers: d.plan[gid].supervisors * d.plan[gid].reviewers,
      target_researchers: d.plan[gid].supervisors * d.plan[gid].reviewers * d.plan[gid].researchers
    }));
    
    const { error: e2 } = await sb.from('project_governorates').insert(pgRows);
    if(e2) throw new Error('تعذر ربط المحافظات: ' + e2.message);
    
    // 3) إعدادات المشروع
    await sb.from('project_settings').insert({ project_id: proj.id });
    
    // 4) مراحل المشروع
    const phases = [
      'workforce', 'structure', 'frame', 'seating', 'training',
      'fieldwork', 'payment', 'reconciliation', 'closure'
    ];
    await sb.from('project_phases').insert(
      phases.map(pt => ({
        project_id: proj.id,
        phase_type: pt,
        phase_status: 'pending'
      }))
    );
    
    // 5) تعيين المسؤولين
    if(d.managerIds.length){
      const pmRows = d.managerIds.map(pid => ({
        project_id: proj.id,
        profile_id: pid,
        assigned_by: profile.id
      }));
      await sb.from('project_managers').insert(pmRows);
    }
    
    // 6) توليد الهيكل
    for(const gid of d.govIds){
      const plan = d.plan[gid];
      const gCode = govCode(gid);
      
      // المشرفون
      const sups = [];
      for(let s = 1; s <= plan.supervisors; s++){
        sups.push({
          project_id: proj.id,
          governorate_id: gid,
          role: 'supervisor',
          code: `${gCode}${String(s).padStart(2, '0')}`
        });
      }
      if(!sups.length) continue;
      
      const { data: supData, error: eS } = await sb.from('structure_slots').insert(sups).select();
      if(eS){ console.warn('مشرفون:', eS.message); continue; }
      
      // المراجعون
      const revs = [];
      supData.forEach(sup => {
        for(let r = 1; r <= plan.reviewers; r++){
          revs.push({
            project_id: proj.id,
            governorate_id: gid,
            role: 'reviewer',
            code: `${sup.code}${String(r).padStart(2, '0')}`,
            parent_slot_id: sup.id
          });
        }
      });
      
      let revData = [];
      if(revs.length){
        const { data, error: eR } = await sb.from('structure_slots').insert(revs).select();
        if(eR){ console.warn('مراجعون:', eR.message); continue; }
        revData = data;
      }
      
      // الباحثون
      const ress = [];
      revData.forEach(rev => {
        for(let a = 1; a <= plan.researchers; a++){
          ress.push({
            project_id: proj.id,
            governorate_id: gid,
            role: 'researcher',
            code: `${rev.code}${String(a).padStart(2, '0')}`,
            parent_slot_id: rev.id
          });
        }
      });
      
      if(ress.length){
        const { error: eRes } = await sb.from('structure_slots').insert(ress);
        if(eRes) console.warn('باحثون:', eRes.message);
      }
    }
    
    showToast('✅ تم إنشاء المشروع بنجاح', 'success');
    state.activeProjectId = proj.id;
    state.activeProjectCache = proj;
    state.tab = 'project-detail';
    state.projectTab = 'overview';
    route();
  } catch(err) {
    showToast(err.message, 'danger');
    btn.disabled = false;
    btn.innerHTML = '✅ إنشاء المشروع';
  }
}

async function submitAddStructureSlot(projectId){
  const govId = document.getElementById('slt_gov').value;
  const role = document.getElementById('slt_role').value;
  const codeInput = document.getElementById('slt_code').value.trim();
  const parentId = document.getElementById('slt_parent').value || null;
  
  if(!govId) return showToast('اختر المحافظة', 'danger');
  
  // توليد كود تلقائي
  let code = codeInput;
  if(!code){
    const { data: existing } = await sb.from('structure_slots')
      .select('code')
      .eq('project_id', projectId)
      .eq('governorate_id', parseInt(govId));
    
    const count = (existing || []).length + 1;
    const gCode = govCode(parseInt(govId));
    code = `${gCode}${String(count).padStart(2, '0')}`;
  }
  
  try {
    const { error } = await sb.from('structure_slots').insert({
      project_id: projectId,
      governorate_id: parseInt(govId),
      role,
      code,
      parent_slot_id: parentId,
      status: 'vacant'
    });
    
    if(error) throw error;
    
    closeModal('addSlotModal');
    showToast('✅ تمت إضافة الكود', 'success');
    renderProjectStructureTab(state.activeProjectCache, state.activeProjectCache.govIds || []);
  } catch(err) {
    showToast(err.message, 'danger');
  }
}

async function submitAssignToSlot(slotId){
  const individualId = document.getElementById('asgn_individual').value;
  const start = document.getElementById('asgn_start').value;
  const end = document.getElementById('asgn_end').value || null;
  
  if(!individualId) return showToast('اختر الفرد', 'danger');
  if(!start) return showToast('تاريخ البداية مطلوب', 'danger');
  
  try {
    const { data: slot } = await sb.from('structure_slots').select('*').eq('id', slotId).single();
    
    // إنشاء التسكين
    await callRPC('create_assignment', {
      p_individual_id: individualId,
      p_project_id: slot.project_id,
      p_slot_id: slotId,
      p_role: slot.role,
      p_start_date: start,
      p_end_date: end,
      p_conflict_override: false,
      p_override_reason: null,
      p_notes: null
    });
    
    closeModal('assignToSlotModal');
    showToast('✅ تم التسكين', 'success');
    renderProjectStructureTab(state.activeProjectCache, state.activeProjectCache.govIds || []);
  } catch(err) {
    if(err.message.includes('تعارض')){
      showToast('⚠️ ' + err.message, 'danger');
    } else {
      showToast(err.message, 'danger');
    }
  }
}

async function openAddManagerModal(projectId){
  const { data: users } = await sb.from('profiles')
    .select('id, full_name, role')
    .in('role', ['project_manager', 'admin'])
    .eq('is_active', true)
    .order('full_name');
  
  const { data: existing } = await sb.from('project_managers')
    .select('profile_id')
    .eq('project_id', projectId);
  
  const existingIds = (existing || []).map(e => e.profile_id);

  const modalHtml = `
    <div class="modal-box">

            <label style="display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;">

          `).join('')}

        <button class="btn btn-primary" onclick="confirmAddManagers('${projectId}')">إضافة</button>

  showModal('addManagerModal', modalHtml);
}

async function confirmAddManagers(projectId){
  const ids = Array.from(document.querySelectorAll('.add-mgr-cb:checked'))
    .map(c => c.value);
  
  if(!ids.length) return showToast('اختر مسؤولاً واحداً على الأقل', 'danger');
  
  const rows = ids.map(pid => ({
    project_id: projectId,
    profile_id: pid,
    assigned_by: profile.id
  }));
  
  const { error } = await sb.from('project_managers').insert(rows);
  closeModal('addManagerModal');
  
  if(error) return showToast('تعذر: ' + error.message, 'danger');
  
  showToast('✅ تمت الإضافة', 'success');
  route();
}

async function removeManager(projectId, profileId){
  if(!confirm('إزالة هذا المسؤول؟')) return;
  
  const { error } = await sb.from('project_managers')
    .delete()
    .eq('project_id', projectId)

  if(error) return showToast('تعذر: ' + error.message, 'danger');
  
  showToast('✅ تمت الإزالة', 'success');
  route();
}
