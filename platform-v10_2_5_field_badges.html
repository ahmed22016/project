const IMPORT_FIELD_MAP = [
  ['الاسم الرباعي','full_name','text'],
  ['النوع','gender','gender'],
  ['نوع التعاقد','contract_type','contract'],
  ['الرقم الكودي','internal_employee_code','text'],
  ['الهاتف الأساسي','phone','phone'],
  ['الهاتف البديل','phone2','phone'],
  ['عنوان السكن بالتفصيل','address','text'],
  ['نوع المؤهل','qualification','text'],
  ['الكلية/المعهد','college','text'],
  ['التخصص','specialization','text'],
  ['سنة التخرج','grad_year','text'],
  ['العمل خارج محل الإقامة','can_work_outside_residence','bool'],
  ['العمل خارج المحافظة','can_work_outside_governorate','bool'],
  ['العمل بالعطلات','can_work_holidays','bool'],
  ['التفرغ الكامل','fully_available','bool'],
  ['ملاحظات صحية','health_note','text'],
  ['ملاحظات المقابلة','interview_notes','text'],
  ['تمت المقابلة','interview_done','bool'],
];
const IMPORT_FIELD_LABELS = Object.fromEntries(IMPORT_FIELD_MAP.map(([label,field])=>[field,label]));
// ملحوظة تصميم: المحافظة مستبعدة من فروقات التحديث (تُغيَّر فقط عبر "طلب نقل").
// "حالة المشتغل" عمود خاص منفصل يُحتسب فقط عندما يكون المستورِد أدمن.

function normalizeAr(s){
  return String(s==null?'':s).trim().replace(/ى/g,'ي').replace(/أ|إ|آ/g,'ا').replace(/\s+/g,' ');
}
function normalizePhoneDigits(v){
  let s = String(v==null?'':v).trim().replace(/\.0+$/,'').replace(/[^0-9]/g,'');
  if(/^1[0125][0-9]{8}$/.test(s)) s = '0'+s;
  return s;
}
function isValidNationalId(v){
  return /^[23][0-9]{2}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])(0[1-9]|1[0-9]|2[0-9]|3[0-5]|88)[0-9]{5}$/.test(v);
}
function isValidEgyptPhone(v){
  return /^01[0125][0-9]{8}$/.test(v);
}
function genderFromDisplay(v){
  const n = normalizeAr(v);
  if(n==='ذكر' || n==='m') return 'm';
  if(n==='انثى' || n==='f') return 'f';
  return null;
}
function genderToDisplay(v){ return v==='m'?'ذكر':v==='f'?'أنثى':'—'; }
function contractFromDisplay(v){
  const n = normalizeAr(v);
  if(n==='موظف داخلي' || n==='internal') return 'internal';
  if(n==='استعانة داخل الجهاز' || n==='استعانة' || n==='outsourced') return 'outsourced';
  if(n==='خارج الجهاز' || n==='external') return 'external';
  return null;
}
function contractToDisplay(v){ return {internal:'موظف داخلي',outsourced:'استعانة داخل الجهاز',external:'خارج الجهاز'}[v] || '—'; }
const STATUS_VALUES = ['pending','active','inactive','rejected','archived'];
function statusFromDisplay(v){
  const n = normalizeAr(v);
  if(!n) return null;
  return STATUS_VALUES.find(s => normalizeAr(statusAr(s)) === n) || null;
}
function boolFromDisplay(v){
  const n = normalizeAr(v);
  if(n==='') return null;
  return (n==='نعم' || n==='true' || n==='منجزة' || n==='تمت' || n==='1');
}
function boolToDisplay(v){ return v===true ? 'نعم' : v===false ? 'لا' : '—'; }
function govIdFromName(name){
  const n = normalizeAr(name);
  const g = govList.find(g => normalizeAr(g.name)===n);
  return g ? g.id : null;
}

async function handleBulkFile(file){
  if(!file) return;
  if(!file.name.match(/\.(xlsx|xls)$/i)) return showToast('صيغة الملف غير مدعومة', 'danger');

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(rows.length === 0) return showToast('الملف فارغ', 'danger');

      const { data: existing, error } = await sb.from('individuals').select('*');
      if(error) throw error;

      processImportRows(rows, existing || []);
    } catch(err) {
      showToast('تعذرت قراءة الملف: ' + err.message, 'danger');
    }
  };
  reader.readAsArrayBuffer(file);
}

function _findCol(row, label){
  return Object.keys(row).find(k => normalizeAr(k)===normalizeAr(label));
}

function processImportRows(rows, existingIndividuals){
  const byNid = new Map(existingIndividuals.map(i => [String(i.national_id), i]));
  const changes = [];       // {individual, diffs:[{field,label,oldVal,newVal}]}
  const newCandidates = []; // {nid, extracted, valid, issues}

  rows.forEach(row => {
    const nidCol = _findCol(row, 'الرقم القومي');
    const nid = nidCol ? String(row[nidCol]).trim() : '';
    if(!nid) return;

    const existing = byNid.get(nid);

    if(!existing){
      const govCol = _findCol(row, 'المحافظة');
      const govName = govCol ? String(row[govCol]).trim() : '';
      const extracted = { national_id: nid, governorate_id: govIdFromName(govName), governorate_name: govName };
      IMPORT_FIELD_MAP.forEach(([label, field, kind]) => {
        const col = _findCol(row, label);
        if(col === undefined) return;
        const raw = row[col];
        if(kind==='bool') extracted[field] = boolFromDisplay(raw);
        else if(kind==='gender') extracted[field] = genderFromDisplay(raw);
        else if(kind==='contract') extracted[field] = contractFromDisplay(raw);
        else if(field==='phone' || field==='phone2') extracted[field] = normalizePhoneDigits(raw);
        else extracted[field] = String(raw==null?'':raw).trim();
      });

      const issues = [];
      if(!extracted.full_name) issues.push('الاسم مفقود');
      if(!isValidNationalId(nid)) issues.push('الرقم القومي غير مطابق للتنسيق الرسمي');
      if(extracted.phone && !isValidEgyptPhone(extracted.phone)) issues.push('رقم الهاتف الأساسي غير صحيح');
      if(!extracted.governorate_id) issues.push('المحافظة غير معروفة أو مفقودة');
      newCandidates.push({ nid, extracted, valid: issues.length===0, issues });
      return;
    }

    const diffs = [];
    IMPORT_FIELD_MAP.forEach(([label, field, kind]) => {
      const col = _findCol(row, label);
      if(col === undefined) return;
      const raw = row[col];
      let newVal, oldVal, displayNew, displayOld;

      if(kind==='bool'){
        newVal = boolFromDisplay(raw);
        if(newVal === null) return;
        oldVal = existing[field];
        if(!!oldVal === !!newVal) return;
        displayOld = boolToDisplay(oldVal); displayNew = boolToDisplay(newVal);
      } else if(kind==='gender'){
        newVal = genderFromDisplay(raw);
        if(!newVal || newVal===existing.gender) return;
        oldVal = existing.gender;
        displayOld = genderToDisplay(oldVal); displayNew = genderToDisplay(newVal);
      } else if(kind==='contract'){
        newVal = contractFromDisplay(raw);
        if(!newVal || newVal===existing.contract_type) return;
        oldVal = existing.contract_type;
        displayOld = contractToDisplay(oldVal); displayNew = contractToDisplay(newVal);
      } else {
        newVal = field==='phone'||field==='phone2' ? normalizePhoneDigits(raw) : String(raw==null?'':raw).trim();
        oldVal = String(existing[field]==null?'':existing[field]).trim();
        if(!newVal || normalizeAr(newVal)===normalizeAr(oldVal)) return;
        displayOld = oldVal; displayNew = newVal;
      }
      diffs.push({ field, label, oldVal: displayOld, newVal, displayOld, displayNew });
    });

    // حالة المشتغل: عمود خاص، يُحتسب فقط لو المستورِد أدمن (الوحيد المخوَّل بتغييرها)
    if(profile.role === 'admin'){
      const statusCol = _findCol(row, 'حالة المشتغل');
      if(statusCol !== undefined){
        const newStatus = statusFromDisplay(row[statusCol]);
        if(newStatus && newStatus !== existing.status){
          diffs.push({
            field: 'status', label: 'حالة المشتغل',
            newVal: newStatus, displayOld: statusAr(existing.status), displayNew: statusAr(newStatus)
          });
        }
      }
    }

    if(diffs.length) changes.push({ individual: existing, diffs });
  });

  renderImportReview(changes, newCandidates, rows.length);
}

function renderImportReview(changes, newCandidates, totalRows){
  const validNew = newCandidates.filter(c => c.valid);
  const invalidNew = newCandidates.filter(c => !c.valid);
  const isAdminUser = profile.role === 'admin';

  const modalHtml = `
    <div class="modal-box wide">
      <h3>مراجعة الاستيراد قبل الحفظ</h3>
      <p class="sub">
        إجمالي صفوف الملف: ${totalRows} — مطابق لسجلات موجودة: ${totalRows - newCandidates.length} —
        لديهم تغييرات فعلية: <b>${changes.length}</b> —
        مرشحون جدد صالحون للإضافة: <b style="color:#3E7C55;">${validNew.length}</b>
        ${invalidNew.length ? ` — <span style="color:#B3492F;">صفوف غير صالحة: ${invalidNew.length}</span>` : ''}
      </p>
      ${!isAdminUser && changes.length ? `<p class="subtle">بصفتك ${roleAr(profile.role)}، التعديلات على مشتغلين موجودين ستُرسَل كطلبات تعديل بانتظار اعتماد الأدمن (وليست فورية).</p>` : ''}

      ${changes.length ? `
      <div class="modal-section">تعديلات على مشتغلين موجودين</div>
      <div style="max-height:40vh;overflow:auto;border:1px solid #DCE3E1;border-radius:10px;padding:10px;">
        ${changes.map((c, ci) => `
          <div style="border-bottom:1px dashed #DCE3E1;padding:10px 4px;">
            <label style="display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px;cursor:pointer;">
              <input type="checkbox" class="import-row-cb" data-ci="${ci}" checked>
              ${esc(c.individual.full_name)} <span class="subtle nums">(${esc(c.individual.national_id)})</span>
            </label>
            <div style="padding-right:26px;font-size:12.5px;">

        `).join('')}

          <div style="border-bottom:1px dashed #DCE3E1;padding:8px 4px;font-size:12.5px;opacity:.7;">
            <input type="checkbox" disabled>
            <b>${esc(c.extracted.full_name||'(بدون اسم)')}</b> <span class="subtle nums">(${esc(c.nid)})</span>
            <span style="color:#B3492F;"> — ${esc(c.issues.join('، '))}</span>
          </div>
        `).join('')}
      </div>
      ` : ''}

      <div class="flex-end" style="margin-top:16px;">
        <button class="btn btn-outline" onclick="closeModal('bulkImportModal')">إلغاء</button>
        ${(changes.length || validNew.length) ? `<button class="btn btn-primary" id="btnApplyImport">تطبيق المحدَّد</button>` : ''}
      </div>
    </div>
  `;
  showModal('bulkImportModal', modalHtml);

  document.querySelectorAll('.import-row-cb').forEach(cb => {
    cb.onchange = () => {
      document.querySelectorAll(`.import-diff-cb[data-ci="${cb.dataset.ci}"]`).forEach(d => d.checked = cb.checked);
    };
  });

  const applyBtn = document.getElementById('btnApplyImport');
  if(applyBtn) applyBtn.onclick = () => applyImportReview(changes, validNew, isAdminUser, applyBtn);
}

async function applyImportReview(changes, validNew, isAdminUser, btn){
  btn.disabled = true;
  btn.textContent = 'جارِ الحفظ...';
  let updated = 0, requested = 0, inserted = 0;
  const failures = [];

  for(let ci=0; ci<changes.length; ci++){
    const rowChecked = document.querySelector(`.import-row-cb[data-ci="${ci}"]`)?.checked;
    if(!rowChecked) continue;
    const c = changes[ci];
    const payload = {};
    c.diffs.forEach((d, di) => {
      const diffChecked = document.querySelector(`.import-diff-cb[data-ci="${ci}"][data-di="${di}"]`)?.checked;
      if(!diffChecked) return;
      payload[d.field] = d.newVal;
    });
    if(Object.keys(payload).length === 0) continue;

    try {
      if(isAdminUser){
        const { error } = await sb.from('individuals').update(payload).eq('id', c.individual.id);
        if(error) throw error;
        updated++;
      } else {
        const { error } = await sb.from('individual_edit_requests').insert({
          individual_id: c.individual.id, requested_by: profile.id, changes: payload, status: 'pending'
        });
        if(error) throw error;
        requested++;
      }
    } catch(err) {
      failures.push({ name: c.individual.full_name, message: err.message });
    }
  }

  for(let ni=0; ni<validNew.length; ni++){
    const cb = document.querySelector(`.import-new-cb[data-ni="${ni}"]`);
    if(!cb || !cb.checked) continue;
    const cand = validNew[ni];
    const { governorate_name, ...toInsert } = cand.extracted;
    try {
      const { error } = await sb.from('individuals').insert({
        ...toInsert, status: 'pending', created_by: profile.id, source: 'bulk_import'
      });
      if(error) throw error;
      inserted++;
    } catch(err) {
      failures.push({ name: cand.extracted.full_name, message: err.message });
    }
  }

  closeModal('bulkImportModal');
  showToast(
    `✅ تحديث مباشر: ${updated} · طلبات تعديل: ${requested} · مضاف جديد: ${inserted}` +
    (failures.length ? ` · فشل: ${failures.length}` : ''),
    failures.length ? 'danger' : 'success'
  );
  route();
}

function _yn(v){ return v===''? null : v==='true'; }

async function submitEditWorkerRequest(workerId, isAdminUser){
  if(!canEditWorkerMaster()) return showToast('غير مصرح لك بتعديل بيانات المشتغل', 'danger');
  isAdminUser = profile.role === 'admin';
  const o = _editWorkerOriginal || {};
  const form = {
    full_name: document.getElementById('ew_name').value.trim(),
    gender: document.getElementById('ew_gender').value || null,
    phone: document.getElementById('ew_phone').value.trim(),
    phone2: document.getElementById('ew_phone2').value.trim(),
    address: document.getElementById('ew_address').value.trim(),
    national_id_expiry_date: document.getElementById('ew_nid_expiry').value,
    contract_type: document.getElementById('ew_contract').value,
    internal_employee_code: document.getElementById('ew_empcode').value.trim(),
    qualification: document.getElementById('ew_qual').value.trim(),
    grad_year: document.getElementById('ew_gradyear').value.trim(),
    college: document.getElementById('ew_college').value.trim(),
    specialization: document.getElementById('ew_spec').value.trim(),
    can_work_outside_residence: _yn(document.getElementById('ew_outres').value),
    can_work_outside_governorate: _yn(document.getElementById('ew_outgov').value),
    can_work_holidays: _yn(document.getElementById('ew_holidays').value),
    fully_available: _yn(document.getElementById('ew_avail').value),
    health_note: document.getElementById('ew_health').value.trim(),
    interview_done: document.getElementById('ew_interview_done').value === 'true',
    interview_notes: document.getElementById('ew_notes').value.trim()
  };

  // احسب الفرق فقط عن القيم الأصلية
  const changes = {};
  for(const key of Object.keys(form)){
    const newVal = form[key];
    const oldVal = o[key] ?? (typeof newVal === 'boolean' ? null : '');
    const oldNorm = oldVal === null || oldVal === undefined ? '' : oldVal;
    const newNorm = newVal === null || newVal === undefined ? '' : newVal;
    if(String(oldNorm) !== String(newNorm)) changes[key] = newVal;
  }

  const hasMediaFiles = workerMediaHasFiles('ew');

  if(!Object.keys(changes).length && !hasMediaFiles){
    return showToast('لا يوجد أي تعديل فعلي أو ملفات جديدة', 'danger');
  }

  const submitBtn = document.getElementById('ew_submit');
  if(submitBtn){
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> جارِ حفظ التعديلات...';
  }

  try {
    let actionMessage = '';

    if(isAdminUser && Object.keys(changes).length){
      const { error } = await sb.from('individuals').update(changes).eq('id', workerId);
      if(error) throw error;
      actionMessage = 'تم حفظ التعديلات';
    } else if(!isAdminUser && Object.keys(changes).length){
      const reqNote = document.getElementById('ew_reqnote')?.value?.trim();
      if(reqNote) changes._request_note = reqNote;

      const { error } = await sb.from('individual_edit_requests').insert({
        individual_id: workerId,
        requested_by: profile.id,
        changes,
        status: 'pending'
      });

      if(error) throw error;
      actionMessage = 'تم إرسال طلب التعديل للاعتماد';
    }

    let mediaUploaded = 0;

    if(hasMediaFiles){
      mediaUploaded = await uploadWorkerMediaFiles(workerId, 'ew');
    }

    closeModal('editWorkerModal');

    const parts = [];
    if(actionMessage) parts.push(actionMessage);
    if(mediaUploaded) parts.push(`تم رفع ${mediaUploaded} ملف`);

    showToast('✅ ' + parts.join(' · '), 'success');
    route();
  } catch(err) {
    showToast(err.message, 'danger');

    if(submitBtn){
      submitBtn.disabled = false;
      submitBtn.innerHTML = '💾 حفظ التعديلات';
    }
  }
}

async function rejectException(id){

    });
    showToast('تم الرفض', 'success');
    renderExceptions();
  } catch(err) { showToast(err.message, 'danger'); }

async function openTrainingModelModal(projectId){

  showModal('trainingModelModal', `
    <div class="modal-box">

      <div class="field" style="margin-bottom:14px;">

        <select id="tm_type" class="input">
          <option value="central" ${d.training_type === 'central' ? 'selected' : ''}>مركزي (القاهرة)</option>

}

async function submitTrainingModel(projectId, existingId){
  const type = document.getElementById('tm_type').value;
  const start = document.getElementById('tm_start').value || null;
  const end = document.getElementById('tm_end').value || null;
  
  try {
    if(existingId){
      await sb.from('project_training_model').update({
        training_type: type, start_date: start, end_date: end
      }).eq('id', existingId);
    } else {
      await sb.from('project_training_model').insert({
        project_id: projectId, training_type: type,
        start_date: start, end_date: end, status: 'pending'
      });
    }
    closeModal('trainingModelModal');
    showToast('✅ تم الحفظ', 'success');
    renderProjectTrainingTab(state.activeProjectCache);
  } catch(err) { showToast(err.message, 'danger'); }
}
